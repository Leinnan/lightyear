[package]
name = "lightyear_iroh"
version = "0.30.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "iroh QUIC IO support for lightyear (via aeronet_iroh)"
repository = "https://github.com/cBournhonesque/lightyear"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
client = ["aeronet_iroh/client"]
server = ["aeronet_iroh/server"]
## Enable gossip-based room discovery (requires iroh-gossip, native-only)
discovery = ["aeronet_iroh/discovery"]

[dependencies]
aeronet_iroh.workspace = true
aeronet_io.workspace = true
lightyear_link.workspace = true
lightyear_aeronet.workspace = true
lightyear_connection.workspace = true
lightyear_core.workspace = true
lightyear_transport.workspace = true
bevy_app.workspace = true
bevy_ecs.workspace = true
tracing.workspace = true
thiserror.workspace = true
